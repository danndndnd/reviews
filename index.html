<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Отзывы</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #121212; color: #ffffff; padding: 16px 16px 85px 16px; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .header h1 { font-size: 26px; font-weight: 800; }
    .rating-summary { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .rating-score { font-size: 38px; font-weight: 800; line-height: 1; }
    .stars { color: #ffb800; font-size: 16px; letter-spacing: 2px; }
    .reviews-count { color: #8e8e93; font-size: 13px; margin-top: 4px; }
    .filters { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 18px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn { background-color: #1e1e1e; color: #8e8e93; border: none; padding: 10px 18px; border-radius: 20px; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; }
    .filter-btn.active { background-color: #2481cc; color: #ffffff; }
    .reviews-list { display: flex; flex-direction: column; gap: 12px; }
    .review-card { background-color: #181a19; border: 1.5px solid #28a745; border-radius: 16px; padding: 14px; }
    .review-card.negative { border-color: #dc3545; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background-color: #2481cc; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; text-transform: uppercase; }
    .username { font-weight: 700; font-size: 15px; }
    .product-name { font-size: 11px; color: #8e8e93; text-transform: uppercase; margin-top: 2px; }
    .card-stars { color: #ffb800; font-size: 13px; }
    .review-text { font-size: 14px; line-height: 1.4; margin-bottom: 8px; }
    .review-date { text-align: right; font-size: 12px; color: #8e8e93; }
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px 20px 16px; background: linear-gradient(transparent, #121212 30%); }
    .submit-btn { width: 100%; background-color: #2481cc; color: #ffffff; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal-content { background: #1e1e1e; padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; }
    .modal-content h3 { margin-bottom: 12px; }
    .modal-content select, .modal-content textarea { width: 100%; background: #121212; color: #fff; border: 1px solid #333; border-radius: 10px; padding: 10px; margin-bottom: 12px; font-size: 14px; }
    .modal-actions { display: flex; gap: 10px; }
  </style>
</head>
<body>

  <div class="header">
    <span style="font-size: 26px;">🎁</span>
    <h1>Отзывы</h1>
  </div>

  <div class="rating-summary">
    <div class="rating-score" id="avg-score">5.0</div>
    <div>
      <div class="stars">★★★★★</div>
      <div class="reviews-count" id="total-count">3 отзыва</div>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="filterReviews('all', this)">Все отзывы</button>
    <button class="filter-btn" onclick="filterReviews('positive', this)">Позитивные</button>
    <button class="filter-btn" onclick="filterReviews('negative', this)">Негативные</button>
  </div>

  <div class="reviews-list" id="reviews-container"></div>

  <div class="bottom-bar">
    <button class="submit-btn" onclick="openModal()">Оставить отзыв</button>
  </div>

  <div class="modal" id="review-modal">
    <div class="modal-content">
      <h3>Новый отзыв</h3>
      <select id="rating-input">
        <option value="5">★★★★★ (5)</option>
        <option value="4">★★★★☆ (4)</option>
        <option value="3">★★★☆☆ (3)</option>
        <option value="2">★★☆☆☆ (2)</option>
        <option value="1">★☆☆☆☆ (1)</option>
      </select>
      <textarea id="text-input" rows="3" placeholder="Напишите ваш отзыв..."></textarea>
      <div class="modal-actions">
        <button class="filter-btn" style="flex:1" onclick="closeModal()">Отмена</button>
        <button class="submit-btn" style="flex:1; padding: 10px;" onclick="addReview()">Отправить</button>
      </div>
    </div>
  </div>

  <script>
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.expand();
        window.Telegram.WebApp.setHeaderColor('#121212');
      }
    } catch (e) {}

    const defaultReviews = [
      { name: 'Максим', product: 'TELEGRAM STARS - 100 ST...', rating: 5, text: 'Всё пришло за 10 секунд, спасибо!', date: '25 ноября 2026' },
      { name: 'Alex', product: 'TELEGRAM STARS - 50 ST...', rating: 5, text: 'Очень быстрый бот', date: '25 ноября 2026' },
      { name: 'Дмитрий', product: 'TELEGRAM STARS - 250 ST...', rating: 5, text: 'Супер, рекомендую', date: '24 ноября 2026' }
    ];

    let reviews = JSON.parse(localStorage.getItem('bot_reviews')) || defaultReviews;

    function renderReviews(filter = 'all') {
      const container = document.getElementById('reviews-container');
      container.innerHTML = '';

      const filtered = reviews.filter(r => {
        if (filter === 'positive') return r.rating >= 4;
        if (filter === 'negative') return r.rating <= 3;
        return true;
      });

      filtered.forEach(r => {
        const starsStr = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
        const cardClass = r.rating >= 4 ? 'review-card' : 'review-card negative';
        const firstLetter = (r.name || 'П')[0];
        
        container.innerHTML += `
          <div class="${cardClass}">
            <div class="card-top">
              <div class="user-info">
                <div class="avatar">${firstLetter}</div>
                <div>
                  <div class="username">${r.name}</div>
                  <div class="product-name">${r.product}</div>
                </div>
              </div>
              <div class="card-stars">${starsStr}</div>
            </div>
            <div class="review-text">${r.text}</div>
            <div class="review-date">${r.date}</div>
          </div>
        `;
      });

      document.getElementById('total-count').innerText = `${reviews.length} отзывов`;
      const avg = (reviews.reduce((s, r) => s + r.rating, 0) / reviews.length).toFixed(1);
      document.getElementById('avg-score').innerText = avg;
    }

    function filterReviews(type, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderReviews(type);
    }

    function openModal() { document.getElementById('review-modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('review-modal').style.display = 'none'; }

    function addReview() {
      const text = document.getElementById('text-input').value.trim();
      const rating = parseInt(document.getElementById('rating-input').value);
      if (!text) return;

      let userName = 'Покупатель';
      try {
        if (window.Telegram?.WebApp?.initDataUnsafe?.user?.first_name) {
          userName = window.Telegram.WebApp.initDataUnsafe.user.first_name;
        }
      } catch (e) {}

      const today = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

      reviews.unshift({
        name: userName,
        product: 'ПОКУПКА В БОТЕ',
        rating: rating,
        text: text,
        date: today
      });

      localStorage.setItem('bot_reviews', JSON.stringify(reviews));
      document.getElementById('text-input').value = '';
      closeModal();
      renderReviews();
    }

    renderReviews();
  </script>
</body>
</html>
